  <meta http-equiv="refresh" content="1; url=mailto:rso@santabarbaraca.gov,sbtenantsunion@gmail.com,Ana@causenow.org?subject=Make%20These%20Important%20Revisions%20to%20the%20Rent%20Stabilization%20Ordinance!&body=To%20City%20of%20Santa%20Barbara%20staff%2C%0A%0AAs%20a%20constituent%20and%20resident%20of%20the%20City%20of%20Santa%20Barbara%2C%20I%20am%20submitting%20the%20following%20comments%20regarding%20the%20draft%20Rent%20Stabilization%20Ordinance%20and%20the%20amendments%20to%20the%20Just%20Cause%20Ordinance.%20I%20make%20these%20comments%20based%20on%20my%20experience%20living%20in%20Santa%20Barbara%20and%20navigating%20the%20local%20rental%20market.%0A%0AThe%20draft%20rent%20stabilization%20ordinance%20requires%20several%20changes%20in%20order%20to%20%0A%0A1.%20Match%20the%20directives%20from%20our%20elected%20officials%2C%20and%20%0A2.%20Close%20loopholes%20that%20undermine%20the%20Rent%20Stabilization%20Ordinance.%20%0A%0ASpecifically%2C%20I%20join%20the%20many%20other%20constituents%20in%20requesting%20the%20following%20changes%20be%20made%3A%0A%0AProposed%20Rent%20Stabilization%20Draft%20Revisions%0A%0AA.%20EXEMPTIONS%20(26.90.010)%0A%20%201.%20Current%20draft%20exceeds%20Council%20direction%20by%20including%20two%20exemptions%20that%20are%20not%20required%20by%20state%20law%3B%20strike%20through%20both%3A%0A%20%20%20%20a)%20Duplex%20%20(26.90.010%203.)%0A%20%20%20%20b)%20Deed%20Restricted%20Units%20(26.90.010%206.)%0AB.%20CAPITAL%20IMPROVEMENTS%20%20(26.90.060)%0A%20%20%20%20a)%20Limits%3A%0A%20%20%20%20%20%20(1)%20Corporate%2FREIT%20owned%20CANNOT%20passthrough%20capital%20improvement%20costs%0A%20%20%20%20%20%20(2)%20Landlords%20owning%204%20units%20or%20less%20CAN%20passthrough%20capital%20improvement%20costs%0A%20%20%20%20%20%20(3)%20Landlords%20owning%205%20or%20more%20units%20CANNOT%20passthrough%20capital%20improvement%20costs%0A%20%20%20%20%20%20(4)%20Allow%20for%20Tenant%20Hardship%20Consideration%0A%20%20%20%20%20%20%20%20(a)%20Families%20using%20public%20benefits%20should%20NOT%20be%20forced%20to%20pay%20for%20capital%20improvements%0A%20%20%20%20%20%20%20%20(b)%20Families%20earning%20less%20than%2080%25%20of%20AMI%20should%20NOT%20be%20forced%20to%20pay%20for%20capital%20improvements%0A%20%20%20%20b)%20Require%20Tenant%20Safety%20Plan%20approved%20prior%20to%20any%20Cap%20Improvement%0A%20%20%20%20%20%20(1)%20Notice%20of%20Capital%20Improvement%20must%20be%20delivered%20to%20the%20tenant%20before%20work%20begins%20or%20before%20passthrough%20may%20be%20approved%0A%20%20%20%20%20%20(2)%20Clear%20timeline%20of%20capital%20improvements%0A%20%20%20%20%20%20(3)%20Relocation%20assistance%20OR%20plans%20to%20be%20moved%20into%20an%20alternate%20unit%20during%20capital%20improvements%0AC.%20FAIR%20RETURN%20%26%20RENT%20ADJUSTMENT%20PETITIONS%20%20(26.90.050)%0A%20%201.%20Remove%20fixed%20%E2%80%9Cright%E2%80%9D%20to%20fair%20return%20that%20removes%20discretion%20of%20hearing%20officer.%20%20(26.90.050)%0A%20%202.%20Include%20presumptions%20that%20guide%20the%20hearing%20officer%20but%20allow%20for%20flexible%20decisions%20that%20include%20all%20proven%20expenses.(26.90.050%20D.)%0A%20%203.%20Same%20petition%20requirements%20for%20landlord%20and%20tenant%20on%20forms%20in%20English%20and%20Spanish.%20%0AD.%20RENTAL%20REGISTRY%20%20(26.90.100)%0A%20%201.%20Require%20all%20rental%20units%20to%20register!%20%0A%20%20%20%20a)%20Draft%20only%20applies%20to%20%E2%80%9Ccovered%20units%E2%80%9D.%20(26.090.100%20B.%20et%20seq)%20%0A%20%20%20%20b)%20Strike%20through%20%E2%80%9Ccovered%E2%80%9D%20in%2026.090.030%20B.%20and%20change%20language%20to%20require%20that%20registration%20is%20only%20complete%20for%20%E2%80%9Ccovered%20units%E2%80%9D%20(26.090.100%20B.%203.)%0A%20%20%20%20c)%20Register%20all%20units%20that%20are%20not%20the%20owner%E2%80%99s%20primary%20residence%20sharing%20facilities%20(bathroom%2Fkitchen)%20(i.e%20home%20shares%20don%E2%80%99t%20need%20to%20register)%0A%20%20%20%20d)%20Information%20that%20SHOULD%20be%20included%20in%20the%20registry%3A%20who%20owns%20the%20unit%2C%20year%20built%2C%20occupancy%2Fvacancy%20status%2C%20date%20of%20last%20rent%20increase%2C%20date%20of%20start%20of%20annual%20year%20lease%2C%20how%20much%20rent%20is%20being%20charged%0A%20%20%20%20e)%20Information%20that%20SHOULD%20NOT%20be%20included%20in%20the%20registry%2C%20to%20avoid%20privacy%20issues%3A%20no%20identifying%20information%20of%20the%20tenant%2C%20no%20tax%20information%20about%20the%20property%0AE.%20RENT%20BOARD%20%20(26.90.090)%0A%20%201.%20Five%2C%20not%20seven%2C%20members%20with%20three%20tenants%20and%20two%20non-tenants%20and%20two%20alternates%2C%20with%20one%20of%20each%20category.%205%20members%20will%20make%20it%20easier%20to%20reach%20a%20quorum.%20%20(26.90.90%20A.)%0A%20%202.%20Enforcement%20Oversight%3A%0A%20%20%20%20a)%20Allow%20the%20rent%20board%20to%20issue%20regulations%20or%20procedures%20(such%20as%20those%20governing%20fair%20return%20petitions%20and%20the%20rental%20registry)%20%22at%20the%20direction%20of%22%20or%20%22approved%20or%20directed%20by%22%20the%20Rent%20Stabilization%20Board.%0A%20%20%20%20b)%20Program%20Oversight%3A%20The%20Board%20should%20be%20able%20to%20direct%20the%20program%20administrator%20to%20take%20action%20and%20oversee%20the%20program%20for%20the%20council%20and%20the%20people.%20%0A%0AOn%20the%20Just%20Cause%20amendments%2C%20the%20following%20changes%20need%20to%20be%20made%3A%0A%0AJust%20Cause%0A%0AA.%20EXEMPTIONS%20(26.50.030)%0A%20%201.%2026.50.030%20(Just%20Cause%20Exemptions)%20copies%20Tenant%20Protection%20Act%20exemption%20language%20word-for-word%2C%20so%20the%20entire%20Chapter%20only%20applies%20to%20properties%20subject%20to%20the%20TPA.%20%20%0A%20%202.%2026.90%20does%20not%20match%2C%20and%20any%20changes%20in%20exemptions%20must%20be%20compatible%20so%20that%20all%20tenancies%20protected%20by%20RSO%20also%20receive%20Just%20Cause%20protections%20from%20eviction.%20%20%0A%20%203.%20JUST%20CAUSE%20FOR%20ALL%20%20(26.50.030)%0A%20%20%20%20a)%20Strike%20out%20the%20duplex%20exemption%20from%2026.50.030%20F.%0A%20%20%20%20b)%20Strike%20out%20Deed%20Restricted%20exemption%20from%2026.50.030%20I.%0A%20%20%20%20c)%20Remove%20%22separately%20alienable%22%20exemption%20from%20Just%20Cause%2026.50.030%20H.%20%0A%20%20%20%20d)%20Remove%20exemption%20for%20%E2%80%9Cnew%E2%80%9D%20construction%20%20(26.50.030%20%20%0AB.%20RELOCATION%20ASSISTANCE%20(26.50.020)%0A%20%201.%20Temporary%20Relocation%20and%20Tenant%20Safety%20Plans%20for%20Renovations%20and%20Remodeling%20must%20be%20included%0A%20%202.%20Permanent%20Relocation%20Increase%0A%20%20%20%20a)%20All%20No-Fault%20Permanent%20Displacement%20is%20at%20a%20Minimum%20the%20amount%20determined%20by%20the%20Tenant%20Displacement%20Assistance%20Ordinance%20(Muni.%20Code%20Chapters%2028.89%20%26%2030.190)%0A%20%20%20%20b)%20When%20local%2C%20state%20or%20federal%20law%20requires%20any%20additional%20relocation%20assistance%2C%20the%20amount%20of%20funds%20or%20type%20of%20services%20must%20be%20included%20in%20the%20notice%20of%20termination%20(Housing%20Crisis%20Act%2C%20Gov.%20Code%20Sec.%2066300%20et%20seq.)%0AC.%20ELLIS%20(26.50.100)%0A%20%201.%20Right%20to%20return%20with%20rent%20regulated%20if%20owner%20changes%20their%20mind%20after%20removing%20the%20unit%20from%20the%20market%0A%20%202.%20Standard%20state%20law%20language%20within%20two%2C%20five%20and%20ten%20years%20as%20prescribed%20in%20Gov.%20Code%207060.2.%0AD.%20FAMILY%20MOVE-IN%20(26.50.070%202.%20a.)%0A%20%201.%20Limit%20family%20move-in%20to%20only%20one%20unit%20per%20property.%0A%20%202.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20students%2C%20school%20staff%20and%20their%20families%20during%20the%20school%20year.%0A%20%203.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20elderly%20and%20disabled%20tenants.%0A%20%204.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20first%20responders%20and%20their%20families.%0AE.%20%22AT%20FAULT%22%20evictions%20should%20only%20be%20based%20on%20substantial%2C%20material%20violations%20that%20a%20tenant%20cannot%20cure.%20%20(26.50.070%201.)%0A%20%201.%20Evictions%20for%20Non-Payment%20(26.50.070%201.%20a.)%3A%0A%20%20%20%20a)%20Only%20allow%20eviction%20for%20non-payment%20when%20the%20amount%20owing%20exceeds%20one%20month%20of%20fair%20market%20rent%20(no%20evictions%20for%20less%20than%20a%20month%20of%20fair%20market%20rent).%0A%20%20%20%20b)%20Add%20rule%20clarifying%20that%20a%20landlord%20cannot%20refuse%20third%20party%20rental%20assistance%20and%20then%20evict.%20%0A%20%202.%20Lease%20Breach%20(26.50.070%201.%20b)%0A%20%20%20%20a)%20Higher%20Standard%20for%20Breach%3A%20To%20evict%20for%20a%20lease%20violation%2C%20the%20landlord%20must%20prove%20that%20the%20violation%20caused%20%22substantial%20actual%20injury%22%20to%20the%20landlord%20or%20other%20residents%2C%20that%20the%20tenant's%20conduct%20was%20%22unreasonable%2C%22%20and%20that%20the%20violated%20term%20was%20non-trivial.%0A%20%20%20%20b)%20Reasonable%20Right%20to%20Cure%3A%20Landlords%20must%20provide%20a%20written%20warning%20notice%20granting%20the%20tenant%20a%20reasonable%20amount%20of%20time%20to%20cure%20the%20lease%20violation%20before%20initiating%20eviction%20proceedings.%0A%20%20%20%20c)%20Subleasing%20Protections%3A%20Landlords%20cannot%20evict%20a%20tenant%20for%20subleasing%20if%20the%20landlord%20unreasonably%20withheld%20the%20right%20to%20sublease.%20A%20landlord's%20refusal%20to%20allow%20a%20subtenant%20cannot%20be%20based%20on%20the%20proposed%20occupant's%20creditworthiness%20if%20that%20occupant%20will%20not%20be%20paying%20rent%20directly%20to%20the%20landlord.%0A%20%20%20%20d)%20Protections%20for%20Families%3A%20Landlords%20are%20prohibited%20from%20evicting%20a%20tenant%20simply%20for%20adding%20a%20child%2C%20parent%2C%20grandchild%2C%20grandparent%2C%20sibling%2C%20spouse%2C%20or%20domestic%20partner%20to%20the%20household%2C%20as%20long%20as%20the%20total%20number%20of%20occupants%20does%20not%20exceed%20maximum%20lawful%20occupancy%20limits.%0A%20%203.%20Nuisance%2C%20Waste%2C%20%26%20Crime%20(26.50.070%201.%20c.-d.)%0A%20%20%20%20a)%20Right%20to%20Cure%20within%20a%20Reasonable%20Time%3A%20Similar%20to%20lease%20breaches%2C%20a%20landlord%20must%20provide%20a%20written%20notice%20giving%20the%20tenant%20the%20opportunity%20to%20cease%20the%20damage%2C%20make%20satisfactory%20corrections%2C%20or%20pay%20reasonable%20repair%20costs.%0A%20%20%20%20b)%20Limit%20to%20substantial%20damage%20or%20loss%2C%20or%20threats%20to%20the%20health%20or%20safety%20of%20other%20occupants%20of%20the%20Property%20or%20of%20the%20immediate%20neighbors%20of%20the%20property%20area.%0A%20%20%20%20c)%20The%20fact%20that%20a%20tenant%20has%20been%20arrested%20not%20on%20the%20property%20or%20convicted%20of%20a%20crime%20in%20the%20past%2C%20been%20the%20victim%20of%20a%20crime%2C%20or%20contacted%20the%20police%20or%20other%20emergency%20services%2C%20in%20and%20of%20itself%2C%20should%20not%20be%20evidence%20of%20nuisance.%20%0A%20%20%20%20d)%20Conduct%20by%20a%20Tenant%20that%20is%20the%20result%20of%20their%20status%20as%20a%20victim%20of%20domestic%20violence%2C%20sexual%20assault%2C%20stalking%2C%20human%20trafficking%2C%20elder%20abuse%2C%20or%20another%20crime%20against%20the%20Tenant%20should%20never%20constitute%20nuisance%20under%20this%20Section%2C%20provided%20that%20the%20Tenant%20can%20provide%20documentation%20or%20other%20evidence%20consistent%20with%20protections%20afforded%20under%20state%20and%20federal%20law.%0A%0AThe%20amendments%20requested%20can%20be%20found%20in%20a%20redlined%20version%20of%20the%20Draft%20Ordinance%20by%20going%20to%20the%20following%20link%3A%20https%3A%2F%2Fbit.ly%2FREDLINEDRSO.%20Please%20include%20the%20amendments%20in%20the%20redlined%20ordinance%20into%20the%20public%20record.%0A%0AThank%20you%2C%0A">
</head>

efits%20should%20NOT%20be%20forced%20to%20pay%20for%20capital%20improvements%0A%20%20%20%20%20%20%20%20(b)%20Families%20earning%20less%20than%2080%25%20of%20AMI%20should%20NOT%20be%20forced%20to%20pay%20for%20capital%20improvements%0A%20%20%20%20b)%20Require%20Tenant%20Safety%20Plan%20approved%20prior%20to%20any%20Cap%20Improvement%0A%20%20%20%20%20%20(1)%20Notice%20of%20Capital%20Improvement%20must%20be%20delivered%20to%20the%20tenant%20before%20work%20begins%20or%20before%20passthrough%20may%20be%20approved%0A%20%20%20%20%20%20(2)%20Clear%20timeline%20of%20capital%20improvements%0A%20%20%20%20%20%20(3)%20Relocation%20assistance%20OR%20plans%20to%20be%20moved%20into%20an%20alternate%20unit%20during%20capital%20improvements%0AC.%20FAIR%20RETURN%20%26%20RENT%20ADJUSTMENT%20PETITIONS%20%20(26.90.050)%0A%20%201.%20Remove%20fixed%20%E2%80%9Cright%E2%80%9D%20to%20fair%20return%20that%20removes%20discretion%20of%20hearing%20officer.%20%20(26.90.050)%0A%20%202.%20Include%20presumptions%20that%20guide%20the%20hearing%20officer%20but%20allow%20for%20flexible%20decisions%20that%20include%20all%20proven%20expenses.(26.90.050%20D.)%0A%20%203.%20Same%20petition%20requirements%20for%20landlord%20and%20tenant%20on%20forms%20in%20English%20and%20Spanish.%20%0AD.%20RENTAL%20REGISTRY%20%20(26.90.100)%0A%20%201.%20Require%20all%20rental%20units%20to%20register!%20%0A%20%20%20%20a)%20Draft%20only%20applies%20to%20%E2%80%9Ccovered%20units%E2%80%9D.%20(26.090.100%20B.%20et%20seq)%20%0A%20%20%20%20b)%20Strike%20through%20%E2%80%9Ccovered%E2%80%9D%20in%2026.090.030%20B.%20and%20change%20language%20to%20require%20that%20registration%20is%20only%20complete%20for%20%E2%80%9Ccovered%20units%E2%80%9D%20(26.090.100%20B.%203.)%0A%20%20%20%20c)%20Register%20all%20units%20that%20are%20not%20the%20owner%E2%80%99s%20primary%20residence%20sharing%20facilities%20(bathroom%2Fkitchen)%20(i.e%20home%20shares%20don%E2%80%99t%20need%20to%20register)%0A%20%20%20%20d)%20Information%20that%20SHOULD%20be%20included%20in%20the%20registry%3A%20who%20owns%20the%20unit%2C%20year%20built%2C%20occupancy%2Fvacancy%20status%2C%20date%20of%20last%20rent%20increase%2C%20date%20of%20start%20of%20annual%20year%20lease%2C%20how%20much%20rent%20is%20being%20charged%0A%20%20%20%20e)%20Information%20that%20SHOULD%20NOT%20be%20included%20in%20the%20registry%2C%20to%20avoid%20privacy%20issues%3A%20no%20identifying%20information%20of%20the%20tenant%2C%20no%20tax%20information%20about%20the%20property%0AE.%20RENT%20BOARD%20%20(26.90.090)%0A%20%201.%20Five%2C%20not%20seven%2C%20members%20with%20three%20tenants%20and%20two%20non-tenants%20and%20two%20alternates%2C%20with%20one%20of%20each%20category.%205%20members%20will%20make%20it%20easier%20to%20reach%20a%20quorum.%20%20(26.90.90%20A.)%0A%20%202.%20Enforcement%20Oversight%3A%0A%20%20%20%20a)%20Allow%20the%20rent%20board%20to%20issue%20regulations%20or%20procedures%20(such%20as%20those%20governing%20fair%20return%20petitions%20and%20the%20rental%20registry)%20%22at%20the%20direction%20of%22%20or%20%22approved%20or%20directed%20by%22%20the%20Rent%20Stabilization%20Board.%0A%20%20%20%20b)%20Program%20Oversight%3A%20The%20Board%20should%20be%20able%20to%20direct%20the%20program%20administrator%20to%20take%20action%20and%20oversee%20the%20program%20for%20the%20council%20and%20the%20people.%20%0A%0AOn%20the%20Just%20Cause%20amendments%2C%20the%20following%20changes%20need%20to%20be%20made%3A%0A%0AJust%20Cause%0A%0AA.%20EXEMPTIONS%20(26.50.030)%0A%20%201.%2026.50.030%20(Just%20Cause%20Exemptions)%20copies%20Tenant%20Protection%20Act%20exemption%20language%20word-for-word%2C%20so%20the%20entire%20Chapter%20only%20applies%20to%20properties%20subject%20to%20the%20TPA.%20%20%0A%20%202.%2026.90%20does%20not%20match%2C%20and%20any%20changes%20in%20exemptions%20must%20be%20compatible%20so%20that%20all%20tenancies%20protected%20by%20RSO%20also%20receive%20Just%20Cause%20protections%20from%20eviction.%20%20%0A%20%203.%20JUST%20CAUSE%20FOR%20ALL%20%20(26.50.030)%0A%20%20%20%20a)%20Strike%20out%20the%20duplex%20exemption%20from%2026.50.030%20F.%0A%20%20%20%20b)%20Strike%20out%20Deed%20Restricted%20exemption%20from%2026.50.030%20I.%0A%20%20%20%20c)%20Remove%20%22separately%20alienable%22%20exemption%20from%20Just%20Cause%2026.50.030%20H.%20%0A%20%20%20%20d)%20Remove%20exemption%20for%20%E2%80%9Cnew%E2%80%9D%20construction%20%20(26.50.030%20%20%0AB.%20RELOCATION%20ASSISTANCE%20(26.50.020)%0A%20%201.%20Temporary%20Relocation%20and%20Tenant%20Safety%20Plans%20for%20Renovations%20and%20Remodeling%20must%20be%20included%0A%20%202.%20Permanent%20Relocation%20Increase%0A%20%20%20%20a)%20All%20No-Fault%20Permanent%20Displacement%20is%20at%20a%20Minimum%20the%20amount%20determined%20by%20the%20Tenant%20Displacement%20Assistance%20Ordinance%20(Muni.%20Code%20Chapters%2028.89%20%26%2030.190)%0A%20%20%20%20b)%20When%20local%2C%20state%20or%20federal%20law%20requires%20any%20additional%20relocation%20assistance%2C%20the%20amount%20of%20funds%20or%20type%20of%20services%20must%20be%20included%20in%20the%20notice%20of%20termination%20(Housing%20Crisis%20Act%2C%20Gov.%20Code%20Sec.%2066300%20et%20seq.)%0AC.%20ELLIS%20(26.50.100)%0A%20%201.%20Right%20to%20return%20with%20rent%20regulated%20if%20owner%20changes%20their%20mind%20after%20removing%20the%20unit%20from%20the%20market%0A%20%202.%20Standard%20state%20law%20language%20within%20two%2C%20five%20and%20ten%20years%20as%20prescribed%20in%20Gov.%20Code%207060.2.%0AD.%20FAMILY%20MOVE-IN%20(26.50.070%202.%20a.)%0A%20%201.%20Limit%20family%20move-in%20to%20only%20one%20unit%20per%20property.%0A%20%202.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20students%2C%20school%20staff%20and%20their%20families%20during%20the%20school%20year.%0A%20%203.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20elderly%20and%20disabled%20tenants.%0A%20%204.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20first%20responders%20and%20their%20families.%0AE.%20%22AT%20FAULT%22%20evictions%20should%20only%20be%20based%20on%20substantial%2C%20material%20violations%20that%20a%20tenant%20cannot%20cure.%20%20(26.50.070%201.)%0A%20%201.%20Evictions%20for%20Non-Payment%20(26.50.070%201.%20a.)%3A%0A%20%20%20%20a)%20Only%20allow%20eviction%20for%20non-payment%20when%20the%20amount%20owing%20exceeds%20one%20month%20of%20fair%20market%20rent%20(no%20evictions%20for%20less%20than%20a%20month%20of%20fair%20market%20rent).%0A%20%20%20%20b)%20Add%20rule%20clarifying%20that%20a%20landlord%20cannot%20refuse%20third%20party%20rental%20assistance%20and%20then%20evict.%20%0A%20%202.%20Lease%20Breach%20(26.50.070%201.%20b)%0A%20%20%20%20a)%20Higher%20Standard%20for%20Breach%3A%20To%20evict%20for%20a%20lease%20violation%2C%20the%20landlord%20must%20prove%20that%20the%20violation%20caused%20%22substantial%20actual%20injury%22%20to%20the%20landlord%20or%20other%20residents%2C%20that%20the%20tenant's%20conduct%20was%20%22unreasonable%2C%22%20and%20that%20the%20violated%20term%20was%20non-trivial.%0A%20%20%20%20b)%20Reasonable%20Right%20to%20Cure%3A%20Landlords%20must%20provide%20a%20written%20warning%20notice%20granting%20the%20tenant%20a%20reasonable%20amount%20of%20time%20to%20cure%20the%20lease%20violation%20before%20initiating%20eviction%20proceedings.%0A%20%20%20%20c)%20Subleasing%20Protections%3A%20Landlords%20cannot%20evict%20a%20tenant%20for%20subleasing%20if%20the%20landlord%20unreasonably%20withheld%20the%20right%20to%20sublease.%20A%20landlord's%20refusal%20to%20allow%20a%20subtenant%20cannot%20be%20based%20on%20the%20proposed%20occupant's%20creditworthiness%20if%20that%20occupant%20will%20not%20be%20paying%20rent%20directly%20to%20the%20landlord.%0A%20%20%20%20d)%20Protections%20for%20Families%3A%20Landlords%20are%20prohibited%20from%20evicting%20a%20tenant%20simply%20for%20adding%20a%20child%2C%20parent%2C%20grandchild%2C%20grandparent%2C%20sibling%2C%20spouse%2C%20or%20domestic%20partner%20to%20the%20household%2C%20as%20long%20as%20the%20total%20number%20of%20occupants%20does%20not%20exceed%20maximum%20lawful%20occupancy%20limits.%0A%20%203.%20Nuisance%2C%20Waste%2C%20%26%20Crime%20(26.50.070%201.%20c.-d.)%0A%20%20%20%20a)%20Right%20to%20Cure%20within%20a%20Reasonable%20Time%3A%20Similar%20to%20lease%20breaches%2C%20a%20landlord%20must%20provide%20a%20written%20notice%20giving%20the%20tenant%20the%20opportunity%20to%20cease%20the%20damage%2C%20make%20satisfactory%20corrections%2C%20or%20pay%20reasonable%20repair%20costs.%0A%20%20%20%20b)%20Limit%20to%20substantial%20damage%20or%20loss%2C%20or%20threats%20to%20the%20health%20or%20safety%20of%20other%20occupants%20of%20the%20Property%20or%20of%20the%20immediate%20neighbors%20of%20the%20property%20area.%0A%20%20%20%20c)%20The%20fact%20that%20a%20tenant%20has%20been%20arrested%20not%20on%20the%20property%20or%20convicted%20of%20a%20crime%20in%20the%20past%2C%20been%20the%20victim%20of%20a%20crime%2C%20or%20contacted%20the%20police%20or%20other%20emergency%20services%2C%20in%20and%20of%20itself%2C%20should%20not%20be%20evidence%20of%20nuisance.%20%0A%20%20%20%20d)%20Conduct%20by%20a%20Tenant%20that%20is%20the%20result%20of%20their%20status%20as%20a%20victim%20of%20domestic%20violence%2C%20sexual%20assault%2C%20stalking%2C%20human%20trafficking%2C%20elder%20abuse%2C%20or%20another%20crime%20against%20the%20Tenant%20should%20never%20constitute%20nuisance%20under%20this%20Section%2C%20provided%20that%20the%20Tenant%20can%20provide%20documentation%20or%20other%20evidence%20consistent%20with%20protections%20afforded%20under%20state%20and%20federal%20law.%0A%0AThe%20amendments%20requested%20can%20be%20found%20in%20a%20redlined%20version%20of%20the%20Draft%20Ordinance%20by%20going%20to%20the%20following%20link%3A%20https%3A%2F%2Fbit.ly%2FREDLINEDRSO.%20Please%20include%20the%20amendments%20in%20the%20redlined%20ordinance%20into%20the%20public%20record.%0A%0AThank%20you%2C%0A">
      tap here to compose the email
    </a>.

20in%20the%20registry%3A%20who%20owns%20the%20unit%2C%20year%20built%2C%20occupancy%2Fvacancy%20status%2C%20date%20of%20last%20rent%20increase%2C%20date%20of%20start%20of%20annual%20year%20lease%2C%20how%20much%20rent%20is%20being%20charged%0A%20%20%20%20e)%20Information%20that%20SHOULD%20NOT%20be%20included%20in%20the%20registry%2C%20to%20avoid%20privacy%20issues%3A%20no%20identifying%20information%20of%20the%20tenant%2C%20no%20tax%20information%20about%20the%20property%0AE.%20RENT%20BOARD%20%20(26.90.090)%0A%20%201.%20Five%2C%20not%20seven%2C%20members%20with%20three%20tenants%20and%20two%20non-tenants%20and%20two%20alternates%2C%20with%20one%20of%20each%20category.%205%20members%20will%20make%20it%20easier%20to%20reach%20a%20quorum.%20%20(26.90.90%20A.)%0A%20%202.%20Enforcement%20Oversight%3A%0A%20%20%20%20a)%20Allow%20the%20rent%20board%20to%20issue%20regulations%20or%20procedures%20(such%20as%20those%20governing%20fair%20return%20petitions%20and%20the%20rental%20registry)%20%22at%20the%20direction%20of%22%20or%20%22approved%20or%20directed%20by%22%20the%20Rent%20Stabilization%20Board.%0A%20%20%20%20b)%20Program%20Oversight%3A%20The%20Board%20should%20be%20able%20to%20direct%20the%20program%20administrator%20to%20take%20action%20and%20oversee%20the%20program%20for%20the%20council%20and%20the%20people.%20%0A%0AOn%20the%20Just%20Cause%20amendments%2C%20the%20following%20changes%20need%20to%20be%20made%3A%0A%0AJust%20Cause%0A%0AA.%20EXEMPTIONS%20(26.50.030)%0A%20%201.%2026.50.030%20(Just%20Cause%20Exemptions)%20copies%20Tenant%20Protection%20Act%20exemption%20language%20word-for-word%2C%20so%20the%20entire%20Chapter%20only%20applies%20to%20properties%20subject%20to%20the%20TPA.%20%20%0A%20%202.%2026.90%20does%20not%20match%2C%20and%20any%20changes%20in%20exemptions%20must%20be%20compatible%20so%20that%20all%20tenancies%20protected%20by%20RSO%20also%20receive%20Just%20Cause%20protections%20from%20eviction.%20%20%0A%20%203.%20JUST%20CAUSE%20FOR%20ALL%20%20(26.50.030)%0A%20%20%20%20a)%20Strike%20out%20the%20duplex%20exemption%20from%2026.50.030%20F.%0A%20%20%20%20b)%20Strike%20out%20Deed%20Restricted%20exemption%20from%2026.50.030%20I.%0A%20%20%20%20c)%20Remove%20%22separately%20alienable%22%20exemption%20from%20Just%20Cause%2026.50.030%20H.%20%0A%20%20%20%20d)%20Remove%20exemption%20for%20%E2%80%9Cnew%E2%80%9D%20construction%20%20(26.50.030%20%20%0AB.%20RELOCATION%20ASSISTANCE%20(26.50.020)%0A%20%201.%20Temporary%20Relocation%20and%20Tenant%20Safety%20Plans%20for%20Renovations%20and%20Remodeling%20must%20be%20included%0A%20%202.%20Permanent%20Relocation%20Increase%0A%20%20%20%20a)%20All%20No-Fault%20Permanent%20Displacement%20is%20at%20a%20Minimum%20the%20amount%20determined%20by%20the%20Tenant%20Displacement%20Assistance%20Ordinance%20(Muni.%20Code%20Chapters%2028.89%20%26%2030.190)%0A%20%20%20%20b)%20When%20local%2C%20state%20or%20federal%20law%20requires%20any%20additional%20relocation%20assistance%2C%20the%20amount%20of%20funds%20or%20type%20of%20services%20must%20be%20included%20in%20the%20notice%20of%20termination%20(Housing%20Crisis%20Act%2C%20Gov.%20Code%20Sec.%2066300%20et%20seq.)%0AC.%20ELLIS%20(26.50.100)%0A%20%201.%20Right%20to%20return%20with%20rent%20regulated%20if%20owner%20changes%20their%20mind%20after%20removing%20the%20unit%20from%20the%20market%0A%20%202.%20Standard%20state%20law%20language%20within%20two%2C%20five%20and%20ten%20years%20as%20prescribed%20in%20Gov.%20Code%207060.2.%0AD.%20FAMILY%20MOVE-IN%20(26.50.070%202.%20a.)%0A%20%201.%20Limit%20family%20move-in%20to%20only%20one%20unit%20per%20property.%0A%20%202.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20students%2C%20school%20staff%20and%20their%20families%20during%20the%20school%20year.%0A%20%203.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20elderly%20and%20disabled%20tenants.%0A%20%204.%20Limits%20on%20owner%2Ffamily%20move-in%20evictions%20of%20first%20responders%20and%20their%20families.%0AE.%20%22AT%20FAULT%22%20evictions%20should%20only%20be%20based%20on%20substantial%2C%20material%20violations%20that%20a%20tenant%20cannot%20cure.%20%20(26.50.070%201.)%0A%20%201.%20Evictions%20for%20Non-Payment%20(26.50.070%201.%20a.)%3A%0A%20%20%20%20a)%20Only%20allow%20eviction%20for%20non-payment%20when%20the%20amount%20owing%20exceeds%20one%20month%20of%20fair%20market%20rent%20(no%20evictions%20for%20less%20than%20a%20month%20of%20fair%20market%20rent).%0A%20%20%20%20b)%20Add%20rule%20clarifying%20that%20a%20landlord%20cannot%20refuse%20third%20party%20rental%20assistance%20and%20then%20evict.%20%0A%20%202.%20Lease%20Breach%20(26.50.070%201.%20b)%0A%20%20%20%20a)%20Higher%20Standard%20for%20Breach%3A%20To%20evict%20for%20a%20lease%20violation%2C%20the%20landlord%20must%20prove%20that%20the%20violation%20caused%20%22substantial%20actual%20injury%22%20to%20the%20landlord%20or%20other%20residents%2C%20that%20the%20tenant's%20conduct%20was%20%22unreasonable%2C%22%20and%20that%20the%20violated%20term%20was%20non-trivial.%0A%20%20%20%20b)%20Reasonable%20Right%20to%20Cure%3A%20Landlords%20must%20provide%20a%20written%20warning%20notice%20granting%20the%20tenant%20a%20reasonable%20amount%20of%20time%20to%20cure%20the%20lease%20violation%20before%20initiating%20eviction%20proceedings.%0A%20%20%20%20c)%20Subleasing%20Protections%3A%20Landlords%20cannot%20evict%20a%20tenant%20for%20subleasing%20if%20the%20landlord%20unreasonably%20withheld%20the%20right%20to%20sublease.%20A%20landlord's%20refusal%20to%20allow%20a%20subtenant%20cannot%20be%20based%20on%20the%20proposed%20occupant's%20creditworthiness%20if%20that%20occupant%20will%20not%20be%20paying%20rent%20directly%20to%20the%20landlord.%0A%20%20%20%20d)%20Protections%20for%20Families%3A%20Landlords%20are%20prohibited%20from%20evicting%20a%20tenant%20simply%20for%20adding%20a%20child%2C%20parent%2C%20grandchild%2C%20grandparent%2C%20sibling%2C%20spouse%2C%20or%20domestic%20partner%20to%20the%20household%2C%20as%20long%20as%20the%20total%20number%20of%20occupants%20does%20not%20exceed%20maximum%20lawful%20occupancy%20limits.%0A%20%203.%20Nuisance%2C%20Waste%2C%20%26%20Crime%20(26.50.070%201.%20c.-d.)%0A%20%20%20%20a)%20Right%20to%20Cure%20within%20a%20Reasonable%20Time%3A%20Similar%20to%20lease%20breaches%2C%20a%20landlord%20must%20provide%20a%20written%20notice%20giving%20the%20tenant%20the%20opportunity%20to%20cease%20the%20damage%2C%20make%20satisfactory%20corrections%2C%20or%20pay%20reasonable%20repair%20costs.%0A%20%20%20%20b)%20Limit%20to%20substantial%20damage%20or%20loss%2C%20or%20threats%20to%20the%20health%20or%20safety%20of%20other%20occupants%20of%20the%20Property%20or%20of%20the%20immediate%20neighbors%20of%20the%20property%20area.%0A%20%20%20%20c)%20The%20fact%20that%20a%20tenant%20has%20been%20arrested%20not%20on%20the%20property%20or%20convicted%20of%20a%20crime%20in%20the%20past%2C%20been%20the%20victim%20of%20a%20crime%2C%20or%20contacted%20the%20police%20or%20other%20emergency%20services%2C%20in%20and%20of%20itself%2C%20should%20not%20be%20evidence%20of%20nuisance.%20%0A%20%20%20%20d)%20Conduct%20by%20a%20Tenant%20that%20is%20the%20result%20of%20their%20status%20as%20a%20victim%20of%20domestic%20violence%2C%20sexual%20assault%2C%20stalking%2C%20human%20trafficking%2C%20elder%20abuse%2C%20or%20another%20crime%20against%20the%20Tenant%20should%20never%20constitute%20nuisance%20under%20this%20Section%2C%20provided%20that%20the%20Tenant%20can%20provide%20documentation%20or%20other%20evidence%20consistent%20with%20protections%20afforded%20under%20state%20and%20federal%20law.%0A%0AThe%20amendments%20requested%20can%20be%20found%20in%20a%20redlined%20version%20of%20the%20Draft%20Ordinance%20by%20going%20to%20the%20following%20link%3A%20https%3A%2F%2Fbit.ly%2FREDLINEDRSO.%20Please%20include%20the%20amendments%20in%20the%20redlined%20ordinance%20into%20the%20public%20record.%0A%0AThank%20you%2C%0A";
